<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* 
         * YOU VS YOU - Premium Email Design System 
         * Theme: Dark Mode First, Vibrant Accents, Glassmorphic 
         */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f0f13;
            color: #ffffff;
            margin: 0;
            padding: 0;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .email-wrapper {
            background-color: #0f0f13;
            width: 100%;
            padding: 40px 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: linear-gradient(180deg, #181921 0%, #121319 100%);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        /* Header / Logo */
        .header {
            text-align: center;
            padding: 40px 20px 20px 20px;
        }
        
        .header img {
            width: 80px;
            height: 80px;
            border-radius: 12px;
            display: block;
            margin: 0 auto;
        }

        /* Content Area */
        .content {
            padding: 30px 40px;
            color: #d1d5db;
            font-size: 15px;
        }

        .content h2 {
            color: #ffffff;
            font-size: 20px;
            font-weight: 600;
            margin-top: 0;
            margin-bottom: 16px;
        }

        .content p {
            margin: 0 0 20px 0;
        }

        .highlight-box {
            background: rgba(255, 255, 255, 0.03);
            border-left: 4px solid #3b82f6;
            border-radius: 0 8px 8px 0;
            padding: 16px 20px;
            margin-bottom: 24px;
        }

        /* Call To Action Button */
        .btn-wrapper {
            text-align: center;
            margin: 32px 0;
        }

        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #2563eb 0%, #4f46e5 100%);
            color: #ffffff !important;
            font-weight: 600;
            font-size: 15px;
            text-decoration: none;
            padding: 14px 32px;
            border-radius: 100px;
            box-shadow: 0 10px 20px -5px rgba(59, 130, 246, 0.4);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .btn:hover {
            box-shadow: 0 15px 25px -5px rgba(59, 130, 246, 0.5);
        }

        /* Footer */
        .footer {
            padding: 30px 40px;
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            background-color: #121319;
        }

        .footer p {
            font-size: 12px;
            color: #6b7280;
            margin: 0 0 10px 0;
        }

        .footer a {
            color: #9ca3af;
            text-decoration: none;
            transition: color 0.2s;
        }

        .footer a:hover {
            color: #ffffff;
            text-decoration: underline;
        }

        .social-links {
            margin-bottom: 20px;
        }

        .social-links a {
            display: inline-block;
            margin: 0 8px;
            color: #9ca3af;
            font-size: 14px;
            font-weight: 500;
        }

        hr {
            border: 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            margin: 32px 0;
        }

        /* Light Mode Fallback (For email clients that don't support dark mode natively, we force dark theme to preserve brand identity) */
    </style>
</head>
<body>
    <table class="email-wrapper" width="100%" cellpadding="0" cellspacing="0" role="presentation">
        <tr>
            <td align="center">
                <table class="container" width="100%" cellpadding="0" cellspacing="0" role="presentation">
                    <!-- Header -->
                    <tr>
                        <td class="header">
                            {% if logo_url %}
                            <img src="{{ logo_url }}" alt="YOU VS YOU Logo">
                            {% endif %}
                        </td>
                    </tr>
                    
                    <!-- Main Content -->
                    <tr>
                        <td class="content">
                            {% block content %}{% endblock %}
                        </td>
                    </tr>
                    
                    <!-- Footer -->
                    <tr>
                        <td class="footer">
                            <div class="social-links">
                                <a href="https://twitter.com/youvsyou">Twitter</a> &bull; 
                                <a href="https://www.instagram.com/the.youvsyou/">Instagram</a> &bull; 
                                <a href="{{ frontend_url }}">Website</a>
                            </div>
                            <p>
                                You are receiving this email because you are a member of YOU VS YOU.
                            </p>
                            <p>
                                <a href="{{ settings_url }}">Notification Preferences</a> | 
                                <a href="{{ unsubscribe_url }}">Unsubscribe</a>
                            </p>
                            <p style="margin-top: 16px;">
                                &copy; {% now "Y" %} YOU VS YOU. All rights reserved.
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
