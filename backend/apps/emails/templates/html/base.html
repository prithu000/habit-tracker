<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    /* Transactional, Minimalist Style */
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        background-color: #ffffff;
        color: #24292f;
        margin: 0;
        padding: 40px 20px;
        line-height: 1.5;
        font-size: 14px;
    }
    .container {
        max-width: 540px;
        margin: 0 auto;
    }
    .content {
        margin-bottom: 30px;
    }
    .footer {
        font-size: 12px;
        color: #57606a;
        border-top: 1px solid #d0d7de;
        padding-top: 20px;
    }
    .footer a {
        color: #0969da;
        text-decoration: none;
    }
    h1, h2, h3 {
        color: #24292f;
        margin-top: 0;
        font-weight: 600;
        font-size: 18px;
    }
    p { margin: 0 0 16px 0; }
    ul { margin: 0 0 16px 0; padding-left: 20px; }
    .btn {
        display: inline-block;
        color: #ffffff;
        background-color: #0969da;
        border-radius: 6px;
        padding: 8px 16px;
        font-size: 14px;
        font-weight: 500;
        text-decoration: none;
        margin-top: 8px;
        margin-bottom: 16px;
    }
    @media (prefers-color-scheme: dark) {
        body { background-color: #0d1117; color: #c9d1d9; }
        h1, h2, h3 { color: #c9d1d9; }
        .footer { color: #8b949e; border-top: 1px solid #30363d; }
        .footer a { color: #58a6ff; }
        .btn { background-color: #21262d; border: 1px solid rgba(240, 246, 252, 0.1); color: #c9d1d9; }
    }
</style>
</head>
<body>
    <div class="container">
        <div class="content">
            {% block content %}{% endblock %}
        </div>
        <div class="footer">
            <p>
                Sent by YOU VS YOU<br>
                <a href="{{ settings_url }}">Notification Preferences</a> &bull; 
                <a href="{{ unsubscribe_url }}">Unsubscribe</a>
            </p>
        </div>
    </div>
</body>
</html>
